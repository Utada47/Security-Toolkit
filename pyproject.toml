[project]
name = "sectoolkit"
version = "0.1.0"
description = "A defensive cybersecurity toolkit: hashing, file analysis, and more"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "cryptography>=42.0",
]

[project.scripts]
sectoolkit = "sectoolkit.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sectoolkit*"]
