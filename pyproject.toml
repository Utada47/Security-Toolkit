[project]
name = "sectoolkit"
version = "0.4.0"
description = "A defensive cybersecurity toolkit: hashing, file analysis, and more"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "cryptography>=42.0",
    "Pillow>=10.0",
    "pypdf>=4.0",
    "oletools>=0.60",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "piexif>=1.1",
]

[project.scripts]
sectoolkit = "sectoolkit.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sectoolkit*"]
